<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>靱公園 · 44mmカード</title>
    <style>
      @font-face {
        font-family: UtsuboJP;
        src: url(assets/font.woff) format("woff");
        font-display: swap;
      }
      body {
        font:
          16px UtsuboJP,
          system-ui;
        margin: 24px;
        color: #142d3c;
      }
      button {
        font: inherit;
        padding: 12px 20px;
      }
      main {
        display: grid;
        grid-template-columns: repeat(3, 54mm);
        gap: 10mm;
        margin-top: 24px;
      }
      figure {
        margin: 0;
        text-align: center;
      }
      img {
        width: 44mm;
        height: 44mm;
        border-radius: 50%;
        display: block;
        margin: auto;
      }
      figcaption {
        margin-top: 3mm;
        font-size: 12pt;
      }
      @page {
        size: A4;
        margin: 15mm;
      }
      @media print {
        header {
          display: none;
        }
        body {
          margin: 0;
        }
        main {
          margin-top: 0;
          gap: 10mm;
          break-inside: avoid;
        }
        figure {
          break-inside: avoid;
        }
      }
      @media screen and (max-width: 650px) {
        main {
          grid-template-columns: repeat(2, 54mm);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>5枚のカードを印刷</h1>
      <p>
        用紙：A4。倍率：100%／実際のサイズ。「ページに合わせる」はオフ。円の外径は44mmです。
      </p>
      <p>光沢の少ない用紙に印刷し、画像の円の外周に沿って切ってください。</p>
      <button onclick="print()">印刷する</button>
    </header>
    <main>
      <figure>
        <img src="assets/cards/sundial.jpg" alt="日時計" />
        <figcaption>日時計 · はじまり／おわり</figcaption>
      </figure>
      <figure>
        <img src="assets/cards/spring.jpg" alt="バラ園" />
        <figcaption>春 · バラ園</figcaption>
      </figure>
      <figure>
        <img src="assets/cards/summer.jpg" alt="噴水" />
        <figcaption>夏 · 噴水</figcaption>
      </figure>
      <figure>
        <img src="assets/cards/autumn.jpg" alt="秋の木" />
        <figcaption>秋 · 秋の木</figcaption>
      </figure>
      <figure>
        <img src="assets/cards/winter.jpg" alt="石碑" />
        <figcaption>冬 · 石碑</figcaption>
      </figure>
    </main>
  </body>
</html>
